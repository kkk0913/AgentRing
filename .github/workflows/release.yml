name: Release

# No Apple account required: ad-hoc app signing + Sparkle Ed25519 signatures.
# One-time setup: docs/auto-update.md. Never generate a new production key per release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate artifacts without publishing a Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: agentring-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version and signing public key
        id: config
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          EXPECTED_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          xcodebuild -version
          if [[ -z "$SPARKLE_PRIVATE_KEY" || -z "$EXPECTED_PUBLIC_KEY" ]]; then
            echo "::error::Configure SPARKLE_PRIVATE_KEY secret and SPARKLE_PUBLIC_ED_KEY variable first. See docs/auto-update.md."
            exit 1
          fi
          PUBLIC_KEY=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | swift Scripts/sparkle-key.swift)
          if [[ "$PUBLIC_KEY" != "$EXPECTED_PUBLIC_KEY" ]]; then
            echo "::error::Signing secret does not match the pinned public key; do not rotate ad-hoc update keys."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$DRY_RUN" == true ]]; then
            VERSION=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' AgentRing.xcodeproj/project.pbxproj | head -1)
          else
            echo "::error::Publishing requires a version tag. Select a tag or enable dry_run."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned Sparkle dependency
        run: |
          xcodebuild -resolvePackageDependencies -project AgentRing.xcodeproj -scheme AgentRing \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Run release regression checks
        run: |
          bash Scripts/test-release-tools.sh
          bash Scripts/test-release-history.sh
          bash Scripts/test-changelog.sh
          bash Scripts/test-credential-store.sh
          bash Scripts/test-ring-display.sh
          bash Scripts/test-multi-account-planning.sh
          bash Scripts/test-cursor-multi-account.sh
          bash Scripts/test-plan-quota.sh
          bash Scripts/test-refresh-state.sh
          bash Scripts/test-update-manager.sh "$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle"

      - name: Build Release
        env:
          VERSION: ${{ steps.config.outputs.version }}
          PUBLIC_KEY: ${{ steps.config.outputs.public_key }}
        run: |
          set -euo pipefail
          xcodebuild -project AgentRing.xcodeproj -scheme AgentRing -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            SPARKLE_PUBLIC_ED_KEY="$PUBLIC_KEY" build

      - name: Sign nested components and verify app
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/AgentRing.app"
          bash Scripts/sign-app.sh "$APP"
          swift Scripts/verify-release.swift "$APP" "$VERSION"

      - name: Verify continuity with the last published update
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/read-release-history.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/previous-release.json"
          if jq -e '.tag_name' "$RUNNER_TEMP/previous-release.json" >/dev/null; then
            swift Scripts/check-release-version.swift "$RUNNER_TEMP/previous-release.json" "$VERSION"
            PREVIOUS_TAG=$(jq -r .tag_name "$RUNNER_TEMP/previous-release.json")
            if jq -e '.assets[] | select(.name == "appcast.xml")' "$RUNNER_TEMP/previous-release.json" >/dev/null; then
              gh release download "$PREVIOUS_TAG" --pattern appcast.xml --dir "$RUNNER_TEMP/previous-feed"
              SIGN_UPDATE=$(find "$RUNNER_TEMP/SourcePackages/artifacts" -type f -name sign_update -print -quit)
              printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - --verify "$RUNNER_TEMP/previous-feed/appcast.xml"
            fi
          fi

      # Every legacy client prefers any .zip and would run its broken shell installer.
      # Sparkle installs the same DMG used for manual first-time installation.
      - name: Package DMG and generate signed appcast
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/AgentRing.app"
          TOOLS=$(find "$RUNNER_TEMP/SourcePackages/artifacts" -type f -name generate_appcast -print -quit)
          test -n "$TOOLS"
          TOOLS=$(dirname "$TOOLS")
          STAGING=$(mktemp -d "$RUNNER_TEMP/agentring-dmg.XXXXXX")
          ditto "$APP" "$STAGING/AgentRing.app"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p dist
          ARCHIVE="AgentRing-${VERSION}-macos.dmg"
          hdiutil create -volname 'Agent Ring' -srcfolder "$STAGING" -format UDZO "dist/$ARCHIVE"
          PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/generate_appcast" --ed-key-file - \
            --maximum-deltas 0 --download-url-prefix "$PREFIX" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            -o dist/appcast.xml dist
          swift Scripts/verify-release.swift "$APP" "$VERSION" dist/appcast.xml "dist/$ARCHIVE" "$PREFIX$ARCHIVE"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/sign_update" --ed-key-file - --verify dist/appcast.xml
          MOUNT=$(mktemp -d "$RUNNER_TEMP/agentring-mount.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "dist/$ARCHIVE"
          trap 'hdiutil detach "$MOUNT"' EXIT
          codesign --verify --deep --strict "$MOUNT/AgentRing.app"
          swift Scripts/verify-release.swift "$MOUNT/AgentRing.app" "$VERSION"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: AgentRing-${{ steps.config.outputs.version }}
          path: |
            dist/*.dmg
            dist/appcast.xml
          if-no-files-found: error

      # /releases/latest/download/appcast.xml never sees a partially uploaded release.
      - name: Publish validated release
        if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) != true ]]; then
              echo "::error::Release is already public; refusing to replace a published signed update. Create a new version tag."
              exit 1
            fi
          else
            PREVIOUS_TAG=$(jq -r '.tag_name // empty' "$RUNNER_TEMP/previous-release.json" 2>/dev/null || true)
            if [[ -f "docs/release-$VERSION.md" ]]; then
              cp "docs/release-$VERSION.md" "$RUNNER_TEMP/release-notes.md"
            else
              swift Scripts/generate-changelog.swift "$PREVIOUS_TAG" "$GITHUB_REF_NAME" docs/release-installation.md "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
            fi
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Agent Ring $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qi '\.zip$'; then
            echo "::error::Draft contains a ZIP asset that would trigger the legacy installer. Remove it manually before retrying."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/AgentRing-${VERSION}-macos.dmg" dist/appcast.xml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
